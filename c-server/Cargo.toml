[package]
name = "c-server"
version = "1.0.0"
edition = "2021"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
web3 = "0.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = "0.7"
tower = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
dotenv = "0.15"
hex = "0.4"
sha2 = "0.10"
rand = "0.8"
lapin = "2.3"
futures = "0.3"

[profile.release]
opt-level = 3
lto = true
