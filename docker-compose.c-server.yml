# Docker Compose for C-Server + RabbitMQ
# Usage: docker-compose -f docker-compose.c-server.yml up

version: '3.8'

services:
  # RabbitMQ message broker
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"      # AMQP port
      - "15672:15672"    # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - c-server-net

  # C-Server: Blockchain listener
  c-server:
    build:
      context: ./c-server
      dockerfile: Dockerfile
    container_name: c-server
    environment:
      # HTTP Server
      C_SERVER_PORT: 8080
      
      # Blockchain (Sepolia testnet)
      BLOCKCHAIN_RPC_URL: ${BLOCKCHAIN_RPC_URL:-https://eth-sepolia.g.alchemy.com/v2/demo}
      USDT_CONTRACT: ${USDT_CONTRACT:-0xaA8E23Fb1079EA71e0a56F48a2aA51851D8433D0}
      USDC_CONTRACT: ${USDC_CONTRACT:-0x1c7D4B196Cb0C7B01d743Fbc6116a902379C7238}
      CUSTODY_WALLET: ${CUSTODY_WALLET:-0x742d35Cc6634C0532925a3b844Bc0e7595f58bF}
      
      # RabbitMQ
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672//
      RABBITMQ_EXCHANGE: gtel-events
      RABBITMQ_ROUTING_KEY: ledger.crypto
      
      # Logging
      RUST_LOG: info
    ports:
      - "8080:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - c-server-net
    restart: unless-stopped

volumes:
  rabbitmq_data:

networks:
  c-server-net:
    driver: bridge
