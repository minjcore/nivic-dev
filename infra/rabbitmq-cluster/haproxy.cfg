global
    log stdout local0
    log stdout local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    user haproxy
    group haproxy
    daemon
    maxconn 4096
    tune.ssl.default-dh-param 2048

defaults
    log     global
    mode    tcp
    option  tcplog
    timeout connect 5000
    timeout client 50000
    timeout server 50000

# Statistics endpoint
listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 30s
    stats show-legends
    stats show-node

# RabbitMQ AMQP Load Balancer (5672)
listen amqp
    bind *:5672
    mode tcp
    balance roundrobin
    option tcplog
    option tcp-check

    # TCP health check for AMQP port
    tcp-check connect port 5672

    server rabbitmq-1 rabbitmq-1:5672 check inter 5000 rise 2 fall 3
    server rabbitmq-2 rabbitmq-2:5672 check inter 5000 rise 2 fall 3
    server rabbitmq-3 rabbitmq-3:5672 check inter 5000 rise 2 fall 3

# RabbitMQ Management UI Load Balancer (15672)
listen management
    bind *:15672
    mode http
    balance roundrobin
    option httpchk GET /api/health

    # HTTP health check for management UI
    http-check expect status 200,401

    server rabbitmq-1 rabbitmq-1:15672 check inter 5000 rise 2 fall 3
    server rabbitmq-2 rabbitmq-2:15672 check inter 5000 rise 2 fall 3
    server rabbitmq-3 rabbitmq-3:15672 check inter 5000 rise 2 fall 3
