# RabbitMQ Cluster Configuration
# For high-availability setup with 3 nodes

## Network and Protocol
listeners.tcp.default = 5672
management.tcp.port = 15672
amqp 0-9-1 = true

## Cluster Setup
# Cluster name
cluster_name = gtel-ledger-cluster

# Cluster partition handling: autoheal (automatic recovery)
cluster_partition_handling = autoheal

# Enable peer discovery via DNS (for Docker Compose)
cluster_formation.peer_discovery_backend = rabbit_peer_discovery_classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq-1
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq-2
cluster_formation.classic_config.nodes.3 = rabbit@rabbitmq-3

## Memory Management
# High watermark: trigger memory alarm at 80% heap usage
vm_memory_high_watermark.relative = 0.8

# Memory limits (in MB)
# Set to ~70% of container memory
total_memory_available_override_value = 750MB

# Heartbeat interval (in seconds)
heartbeat = 15

## Queue / Message Settings
# Channel max: max number of channels per connection
channel_max = 2048

# Connection max: max number of connections
connection_max = unlimited

# Queue master location strategy: all (replicate to all nodes)
queue_master_location = all

## Persistence
# Store queue/exchange definitions on disk
mnesia_base = /var/lib/rabbitmq

# Log file location
log.file.level = info

## Performance Tuning
# Channel operation timeout (ms)
channel_operation_timeout = 15000

# Frame max size (in bytes) - 131072 = 128KB
frame_max = 131072

# Max connections per queue
max_message_size = 134217728

## Management Plugin
management.load_definitions = /etc/rabbitmq/definitions.json
management.tcp.backlog = 128

## High Availability
# Enable mirrored queues (HA)
# Note: This is configured via policies at runtime
# queue_master_location = all

# Sync strategy: automatic
# ha.sync_mode = automatic

## Monitoring
# Enable prometheus metrics
prometheus.return_per_object_metrics = true
prometheus.path_prefix = /metrics

## Advanced Settings
# Core threads for thread pool
channel_pids_max = 2048000

# Maximum open file handles
ulimit.nofile = 65535

# Prevent memory leaks in long-running connections
max_connection_backoff = 60000
