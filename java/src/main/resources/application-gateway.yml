spring:
  application:
    name: saving-gateway

  # RabbitMQ Configuration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:gtel-c-server}
    password: ${RABBITMQ_PASSWORD:password}
    virtual-host: ${RABBITMQ_VHOST:/gtel-prod}

    # Publisher confirms
    publisher-confirms: true
    publisher-returns: true

    # Connection pool (CHANNEL cache mode only supports channel size, not connection size)
    cache:
      channel:
        size: 10

  # Redis Configuration
  redis:
    host: ${REDIS_HOST:redis}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: ${REDIS_DB:0}
    timeout: 2000ms

    # Connection pool
    jedis:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 5
        max-wait: 1000ms

  # Logging
  jpa:
    hibernate:
      ddl-auto: none

  jackson:
    serialization:
      write-dates-as-timestamps: true

# Server Configuration
server:
  port: ${GATEWAY_PORT:8091}
  servlet:
    context-path: /

  error:
    include-message: always
    include-binding-errors: always

# Gateway Configuration
gateway:
  api-keys: ${GATEWAY_API_KEYS:c-server-1=secret1,c-server-2=secret2}
  rate-limit:
    default-rps: 10000  # 10k events/sec per client
  circuit-breaker:
    timeout-ms: 30000   # 30 seconds before HALF_OPEN
    max-buffer-size: 100000
  batch:
    size: 1000
    window-ms: 100

# Logging Configuration
logging:
  level:
    root: INFO
    dev.nivic.gateway: DEBUG
    org.springframework.amqp: INFO
    org.springframework.data.redis: INFO

  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

  file:
    name: ~/logs/gateway/saving-gateway.log
    max-size: 100MB
    max-history: 30
    total-size-cap: 3GB

# Management
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info,prometheus

  endpoint:
    health:
      show-details: always

  metrics:
    export:
      prometheus:
        enabled: true
