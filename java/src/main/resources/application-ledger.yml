spring:
  application:
    name: COA-Ledger
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.cache.CacheAutoConfiguration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQL10Dialect
  datasource:
    url: jdbc:postgresql://postgres:5432/gtelpay_prod
    username: postgres
    password: postgres
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: gtel-c-server
    password: password
    virtual-host: /gtel-prod
  # Redis disabled for ledger profile (not required for accounting)
  # redis:
  #   host: redis
  #   port: 6379

server:
  port: 8090
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true
  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: false
    status:
      http-mapping:
        DOWN: 200

logging:
  level:
    root: INFO
    dev.nivic: DEBUG
