global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'gtel-ledger-monitor'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - '/etc/prometheus/alert-rules.yml'

scrape_configs:
  # Java Ledger Application Metrics
  - job_name: 'java-ledger'
    static_configs:
      - targets: ['java-ledger:8090']
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    scrape_timeout: 5s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'java-ledger'

  # Saving-Gateway Metrics
  - job_name: 'saving-gateway'
    static_configs:
      - targets: ['saving-gateway:8091']
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    scrape_timeout: 5s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'saving-gateway'

  # RabbitMQ Management API
  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15672']
    metrics_path: '/metrics'
    basic_auth:
      username: 'gtel-c-server'
      password: 'password'
    scrape_interval: 15s

  # Redis
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    scrape_interval: 10s

  # PostgreSQL Exporter
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 15s

  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']
